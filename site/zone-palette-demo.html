<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Палитра зон — градиент и контраст</title>
<style>
  :root { --ink:#0D0D0D; --n100:#D6D6D2; --n300:#A6A6A2; --n800:#262930; --n950:#111318; --accent:#0047FF;
    --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-8:32px; --page-pad:20px; --r-sm:2px;
    --font:'Manrope',system-ui,sans-serif; --f-num:'Oranienbaum',Georgia,serif; }
  *, *::before, *::after { box-sizing: border-box; }
  body { background: var(--ink); color: var(--n100); font-family: var(--font); -webkit-font-smoothing: antialiased; }
  h1, .t-h1 { font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 400; font-size: 2.2rem; }
  .t-h3 { font-family: 'Forum', Georgia, serif; font-size: 1.1rem; }
  .t-body-sm { font-size: 12px; }
  .t-eyebrow { font-size: 10px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: var(--n300); }
  .t-caption { font-size: 10px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: #7A7A78; }
  input[type=range] { accent-color: var(--accent); }
  body { margin: 0; padding: var(--sp-8) var(--page-pad); }
  .wrap { max-width: 1100px; margin: 0 auto; display: grid; gap: var(--sp-8); }
  .ctl { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: var(--sp-4); }
  .ctl label { display: block; margin-bottom: var(--sp-2); }
  .ctl input { width: 100%; }
  .row { border: 1px solid var(--n800); background: var(--n950); padding: var(--sp-5); border-radius: var(--r-sm); }
  .row-head { display: flex; justify-content: space-between; align-items: baseline; gap: var(--sp-4); margin-bottom: var(--sp-4); flex-wrap: wrap; }
  .zones { display: grid; grid-template-columns: repeat(5, 1fr); gap: var(--sp-3); }
  .z { display: grid; gap: var(--sp-2); }
  .z-seats { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
  .z-seats i { aspect-ratio: 1; border-radius: 50%; display: block; }
  .z-bar { height: 28px; border-radius: var(--r-sm); }
  .z-name { font-size: 11px; color: var(--n300); }
  .z-price { font-family: var(--f-num); font-size: 17px; color: var(--n100); }
  @media (max-width: 640px) { .zones { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Oranienbaum&family=Forum&family=Manrope:wght@400;500;600&display=swap">
<div class="wrap">
  <div>
    <div class="t-eyebrow">Палитра зон схемы зала</div>
    <h1 class="t-h1" style="margin:8px 0 0">Градиент и контрастный набор</h1>
  </div>

  <div class="ctl">
    <div><label class="t-caption">Шаг градиента — светлота, %: <span id="vL"></span></label><input id="sL" type="range" min="0" max="40" value="22"></div>
    <div><label class="t-caption">Шаг градиента — сдвиг оттенка, °: <span id="vH"></span></label><input id="sH" type="range" min="0" max="140" value="60"></div>
    <div><label class="t-caption">Насыщенность (chroma): <span id="vC"></span></label><input id="sC" type="range" min="4" max="22" value="15"></div>
  </div>

  <div id="rows" style="display:grid;gap:var(--sp-5)"></div>
</div>

<script>
const names = ['Ложа','Партер','Амфитеатр','Бельэтаж','Балкон'];
const prices = ['12 000 ₽','8 500 ₽','5 200 ₽','3 400 ₽','1 800 ₽'];

/* OKLCH → sRGB hex */
function oklch(L, C, H){
  const a = C*Math.cos(H*Math.PI/180), b = C*Math.sin(H*Math.PI/180);
  const l_ = L + 0.3963377774*a + 0.2158037573*b, m_ = L - 0.1055613458*a - 0.0638541728*b, s_ = L - 0.0894841775*a - 1.2914855480*b;
  const l=l_**3, m=m_**3, s=s_**3;
  let r= 4.0767416621*l-3.3077115913*m+0.2309699292*s,
      g=-1.2684380046*l+2.6097574011*m-0.3413193965*s,
      bl=-0.0041960863*l-0.7034186147*m+1.7076147010*s;
  const f=x=>{x=Math.min(1,Math.max(0,x));return x<=0.0031308?12.92*x:1.055*x**(1/2.4)-0.055};
  return '#'+[r,g,bl].map(v=>Math.round(f(v)*255).toString(16).padStart(2,'0')).join('');
}
function lab(hex){
  const c=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16)/255).map(v=>v<=0.04045?v/12.92:((v+0.055)/1.055)**2.4);
  const [r,g,b]=c;
  const l=Math.cbrt(0.4122214708*r+0.5363325363*g+0.0514459929*b),
        m=Math.cbrt(0.2119034982*r+0.6806995451*g+0.1073969566*b),
        s=Math.cbrt(0.0883024619*r+0.2817188376*g+0.6299787005*b);
  return [0.2104542553*l+0.7936177850*m-0.0040720468*s,1.9779984951*l-2.4285922050*m+0.4505937099*s,0.0259040371*l+0.7827717662*m-0.8086757660*s];
}
const dE=(a,b)=>{const x=lab(a),y=lab(b);return Math.hypot(x[0]-y[0],x[1]-y[1],x[2]-y[2])*100};
const minDelta=cols=>Math.min(...cols.slice(1).map((c,i)=>dE(cols[i],c)));

function gradient(stepL, stepH, C){
  /* светлота идёт от тёмной ложи к светлому балкону, оттенок — по дуге от 250° */
  return names.map((_,i)=>oklch(0.42 + (stepL/100)*i/4*1.0 + 0.0, C/100, (250 + stepH*i/4) % 360));
}
const contrast = ['#C9975A','#3F73E3','#2BA7B8','#7E6FD0','#33B978']; /* текущие --zone-1…5 */

function row(title, note, cols){
  const md = minDelta(cols);
  const el = document.createElement('div'); el.className='row';
  el.innerHTML = `<div class="row-head"><div><div class="t-h3">${title}</div><div class="t-body-sm" style="color:var(--n300)">${note}</div></div>
    <div class="t-caption">мин. разница соседних зон: <b style="color:var(--n100)">${md.toFixed(1)}</b> ΔE</div></div>
    <div class="zones">${cols.map((c,i)=>`<div class="z"><div class="z-bar" style="background:${c}"></div>
      <div class="z-seats">${Array.from({length:12},()=>`<i style="background:${c}"></i>`).join('')}</div>
      <div class="z-name">${names[i]}</div><div class="z-price">${prices[i]}</div>
      <div class="z-name" style="font-family:var(--font)">${c}</div></div>`).join('')}</div>`;
  return el;
}

function render(){
  const L=+sL.value, H=+sH.value, C=+sC.value;
  vL.textContent=L; vH.textContent=H; vC.textContent=C;
  rows.replaceChildren(
    row('A · Градиент, малый шаг','Как на тесте: плавный перелив, соседние зоны близки.', gradient(8,20,C)),
    row('B · Градиент, увеличенный шаг','Двигай ползунки: светлота и оттенок разводят соседние зоны.', gradient(L,H,C)),
    row('C · Контрастный набор','Текущие --zone-1…5 из ядра, как на проде.', contrast)
  );
}
[sL,sH,sC].forEach(s=>s.addEventListener('input',render));
render();
</script>
</body>
</html>
