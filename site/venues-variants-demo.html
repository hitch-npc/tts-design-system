<html lang="ru">
<head>
<meta charset="utf-8">

<title>Площадки</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Oranienbaum&family=Forum&family=Manrope:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="../ds-core-r14.css">
<style>
  :root { --ease:cubic-bezier(.16,1,.3,1); --ease-std:cubic-bezier(.4,0,.2,1); }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin:0; background:var(--ink); color:var(--n100); font-family:var(--font); font-size:14px; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; }
  button, input { font: inherit; color: inherit; }
  .page { max-width:1200px; margin:0 auto; padding:40px 56px 120px; display:flex; flex-direction:column; gap:24px; }
  @media (max-width:760px) { .page { padding:24px 20px 120px; gap:18px; } }

  .head { display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  h1 { margin:0; font-family:var(--f-thin); font-weight:400; font-size:clamp(30px,4vw,40px); line-height:1.1; }

  /* Поиск слева, переключатель вида по центру */
  .tools { display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); gap:16px; align-items:center; }
  .search { position:relative; max-width:440px; }
  .search > svg { position:absolute; left:14px; top:50%; transform:translateY(-50%); width:14px; height:14px; color:var(--n500); }
  .search input { width:100%; height:40px; padding:0 40px 0 38px; background:var(--n950); border:1px solid var(--n800); border-radius:var(--r-sm); font-size:14px; color:var(--n100); }
  .search input::placeholder { color:var(--n600); }
  .search input:focus { outline:none; border-color:var(--accent); }
  .search .search-clear { position:absolute; right:6px; top:50%; transform:translateY(-50%); }
  @media (max-width:1080px), (pointer:coarse) { .search input { font-size:16px; } }
  .seg { display:inline-flex; border:1px solid var(--n800); border-radius:var(--r-sm); overflow:hidden; }
  .seg button { appearance:none; background:transparent; border:0; min-width:112px; padding:10px 18px; font-size:11px; font-weight:600; letter-spacing:.16em; text-transform:uppercase; color:var(--n300); cursor:pointer; transition:color var(--dur-base) var(--ease-std), background var(--dur-base) var(--ease-std); }
  .seg button + button { border-left:1px solid var(--n800); }
  .seg button:hover { color:var(--n100); }
  .seg button[aria-pressed="true"] { background:var(--accent-ghost); color:var(--n100); box-shadow:inset 0 0 0 1px var(--accent); }
  @media (max-width:760px) {
    .tools { grid-template-columns:1fr; }
    .seg { order:-1; justify-self:center; }
    .search { max-width:none; }
  }

  /* Логотип площадки; без логотипа — монограмма */
  .logo { flex:none; width:40px; height:40px; display:grid; place-items:center; border:1px solid var(--n800); border-radius:var(--r-sm); background:var(--n950); overflow:hidden; }
  .logo img { width:80%; height:80%; object-fit:contain; display:block; }
  .logo span { font-family:var(--f-head); font-size:15px; color:var(--n300); }
  .name { font-family:var(--f-head); font-size:19px; line-height:1.25; color:var(--n100); }
  .addr { font-size:12px; color:var(--n400); line-height:1.5; }

  /* Отметка выбора — квадрат с галочкой */
  .tick { flex:none; width:20px; height:20px; display:grid; place-items:center; border:1px solid var(--n700); border-radius:var(--r-sm); color:transparent; transition:background var(--dur-base) var(--ease-std), border-color var(--dur-base) var(--ease-std); }
  .tick svg { width:12px; height:12px; }
  [aria-pressed="true"] .tick { background:var(--accent); border-color:var(--accent); color:var(--on-accent); }

  /* Карта: список и карта рядом */
  .split { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.15fr); gap:24px; align-items:start; }
  .rows { display:flex; flex-direction:column; border-top:1px solid var(--n800); max-height:620px; overflow:auto; }
  .row { appearance:none; width:100%; text-align:left; background:transparent; border:0; border-bottom:1px solid var(--n800); display:grid; grid-template-columns:40px minmax(0,1fr) 20px; gap:14px; align-items:center; padding:12px 10px; cursor:pointer; transition:background var(--dur-base) var(--ease-std), box-shadow var(--dur-base) var(--ease-std); }
  .row:hover, .row.is-hl { background:var(--n950); }
  .row[aria-pressed="true"] { background:var(--accent-ghost); box-shadow:inset 2px 0 0 var(--accent); }
  .row .name { font-size:17px; }
  .map { position:sticky; top:16px; height:620px; border:1px solid var(--n800); border-radius:var(--r-sm); overflow:hidden; background:var(--n950); display:grid; place-items:center; text-align:center; }
  .map::before { content:""; position:absolute; inset:0; background:
      linear-gradient(var(--n900) 1px, transparent 1px) 0 0 / 48px 48px,
      linear-gradient(90deg, var(--n900) 1px, transparent 1px) 0 0 / 48px 48px; opacity:.7; }
  .map-c { position:relative; display:flex; flex-direction:column; gap:8px; align-items:center; padding:24px; max-width:340px; }
  .map-c svg { width:28px; height:28px; color:var(--n400); }
  .map-c .t { font-family:var(--f-head); font-size:19px; }
  .map-c .d { font-size:12px; color:var(--n400); line-height:1.6; }
  @media (max-width:860px) {
    .split { grid-template-columns:1fr; }
    .map { order:-1; position:relative; top:0; height:300px; }
    .rows { max-height:none; }
  }

  /* Плитки */
  .tiles { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:16px; }
  @media (max-width:1000px) { .tiles { grid-template-columns:repeat(2, minmax(0,1fr)); } }
  @media (max-width:600px) { .tiles { grid-template-columns:1fr; gap:10px; } }
  .vt { appearance:none; text-align:left; position:relative; isolation:isolate; overflow:hidden; display:flex; flex-direction:column; gap:10px; min-height:208px; padding:24px;
    background:var(--n950); border:1px solid var(--n800); border-radius:var(--r-sm); color:inherit; cursor:pointer; transition:border-color var(--dur-fast) var(--ease-std), background var(--dur-base) var(--ease-std); }
  .vt::before { content:""; position:absolute; inset:-30%; z-index:-1; pointer-events:none; opacity:0;
    background:radial-gradient(ellipse 70% 60% at 72% 100%, var(--blob-core) 0%, var(--blob-mid) 45%, transparent 78%); filter:blur(40px);
    transform:scale(.85); transform-origin:72% 100%; transition:opacity var(--dur-slow) var(--ease-std), transform var(--dur-slow) var(--ease-std); }
  .vt:hover { border-color:var(--n600); }
  .vt:hover::before, .vt[aria-pressed="true"]::before { opacity:.7; transform:scale(1); }
  .vt[aria-pressed="true"] { border-color:var(--accent); background:var(--accent-ghost); }
  .vt .vt-top { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:6px; }
  .vt .logo { width:56px; height:56px; }
  .vt .logo span { font-size:19px; }
  .vt .name { font-size:21px; line-height:1.2; margin-top:auto; }
  @media (max-width:600px) { .vt { min-height:0; padding:20px; } .vt .name { font-size:19px; margin-top:0; } }
  .empty { padding:32px 0; color:var(--n400); font-size:13px; }

  /* Панель «Применить» — появляется, когда выбор отличается от показанного */
  .apply { position:fixed; left:50%; bottom:20px; z-index:20; display:flex; align-items:center; gap:12px; padding:10px 10px 10px 18px;
    background:var(--n950); border:1px solid var(--n700); border-radius:var(--r-sm); box-shadow:0 12px 32px var(--shadow-color);
    transform:translate(-50%, 16px); opacity:0; pointer-events:none; transition:transform 420ms var(--ease), opacity 252ms var(--ease-std); }
  .apply.on { transform:translate(-50%, 0); opacity:1; pointer-events:auto; }
  .apply .apply-n { font-size:13px; color:var(--n300); white-space:nowrap; }
  .apply .apply-n b { font-weight:600; color:var(--n100); }
  @media (max-width:600px) { .apply { left:12px; right:12px; bottom:12px; transform:translateY(16px); } .apply.on { transform:none; } .apply .apply-n { margin-right:auto; } }

  /* События выбранных площадок */
  .results { display:flex; flex-direction:column; scroll-margin-top:16px; border-top:1px solid var(--n800); }
  .results:empty { display:none; }
  /* Площадка: слева заголовок (логотип, название, адрес) держится при прокрутке, справа — месяцы и карточки */
  .venue-block { display:grid; grid-template-columns:240px minmax(0,1fr); gap:32px; padding:32px 0; border-bottom:1px solid var(--n800); }
  .vb-head { position:sticky; top:16px; align-self:start; display:flex; flex-direction:column; align-items:flex-start; gap:14px; }
  .vb-head .logo { position:relative; isolation:isolate; width:120px; height:84px; border:0; background:none; overflow:visible; }
  .vb-head .logo::before { content:""; position:absolute; inset:-10% 0; z-index:-1; border-radius:50%; pointer-events:none;
    background:radial-gradient(ellipse at center, var(--blob-core) 0%, var(--blob-mid) 45%, transparent 72%); filter:blur(28px); opacity:.55; }
  .vb-head .logo img { width:100%; height:100%; max-width:none; max-height:none; object-fit:contain; object-position:left center; }
  .vb-head .logo span { font-size:44px; color:var(--n200); }
  .vb-head h2 { margin:0; font-family:var(--f-thin); font-weight:500; font-size:24px; line-height:1.2; }
  .vb-head h2:focus { outline:none; }
  .vb-head .addr { margin-top:6px; }
  .vb-body { display:flex; flex-direction:column; gap:20px; min-width:0; }
  .month { display:flex; flex-direction:column; gap:10px; }
  .month h3 { margin:0; font-size:10px; font-weight:500; letter-spacing:.14em; text-transform:uppercase; color:var(--n500); }

    .vb-head { position:static; flex-direction:row; align-items:center; gap:16px; }
    .vb-head .logo { width:88px; height:62px; flex:none; }
    .vb-head .logo span { font-size:32px; }
    .vb-head h2 { font-size:22px; }
  }

  /* Горизонтальная карточка события: миниатюра с датой, жанр и ценз, название, показы, цена */
  .cards { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px; }
  @media (max-width:640px) { .cards { grid-template-columns:minmax(0,1fr); } }
  .vh { display:grid; grid-template-columns:104px minmax(0,1fr) auto; gap:14px; align-items:center; padding:10px 14px 10px 10px; background:var(--n950); border:1px solid var(--n800); border-radius:var(--r-sm); color:inherit; text-decoration:none; transition:border-color var(--dur-base) var(--ease-out); }
  .vh:hover { border-color:var(--n600); }
  .vh-thumb { position:relative; overflow:hidden; height:76px; border-radius:var(--r-sm); background:var(--n900); display:flex; flex-direction:column; justify-content:flex-end; padding:8px 10px; }

  .vh-mon { position:relative; margin-top:4px; font-size:9px; font-weight:500; letter-spacing:.14em; text-transform:uppercase; color:var(--n300); }
  .vh-body { min-width:0; display:flex; flex-direction:column; gap:5px; }
  .vh-body .event-card-meta { margin:0; }
  .vh-title { font-family:var(--f-head); font-size:19px; line-height:1.2; color:var(--n100); display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; line-clamp:2; overflow:hidden; }
  .vh-sub { font-size:11px; color:var(--n500); }
  .vh-price { text-align:right; white-space:nowrap; }
  .vh-price .event-card-price { font-size:19px; }
  @media (max-width:400px) { .vh { grid-template-columns:84px minmax(0,1fr); } .vh-price { grid-column:2; text-align:left; } }

  @media (prefers-reduced-motion: reduce) {
    * { transition:none !important; }
    .vt::before { transform:none !important; }
  }
</style>

"], [10, "Поединок", "2026-12-22", "19:00", 3500, "Спектакль", 12, "plays"], [11, "«Когда пришла к тебе любовь»", "2026-11-23", "19:00", 5000, "Спектакль", 6, "plays"], [11, "Шанель № Стравинский", "2026-11-26", "19:00", 4000, "Спектакль", 16, "plays"], [12, "Психопаты", "2026-11-09", "19:00", 3000, "Спектакль", 16, "plays"], [12, "Психопаты", "2026-11-10", "19:00", 3000, "Спектакль", 16, "plays"], [13, "Лавр", "2026-11-09", "19:00", 0, "Спектакль", 12, "plays"], [14, "Международный органный фестиваль при свечах", "2027-03-12", "19:00", 3000, "Классика", 6, "classics"], [15, "Королева красоты", "2026-11-28", "19:00", 3500, "Спектакль", 12, "plays"], [16, "Кыся", "2026-11-16", "19:00", 18000, "Спектакль", 16, "plays"], [17, "Папа", "2026-11-23", "19:00", 3500, "Спектакль", 16, "plays"]];
/* E: [площадка, событие, дата, время, цена от, жанр, ценз, раздел] */
const MON=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const MON_G=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const DOW=['вс','пн','вт','ср','чт','пт','сб'];
const pl=(n,a,b,c)=>n%10===1&&n%100!==11?a:(n%10>=2&&n%10<=4&&(n%100<12||n%100>14)?b:c);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rub=n=>n.toLocaleString('ru-RU').replace(/ /g,' ')+' ₽';
const ICON_S='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="5"/><path d="M11 11l3.5 3.5"/></svg>';
const ICON_X='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
const ICON_TICK='<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 6.2l2.3 2.3 4.7-5"/></svg>';
const ICON_PIN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>';
const GENRE={'Концерт':'card-warm','Детям':'card-green'};

/* Порядок площадок — по числу событий, от большего к меньшему; само число не показывается */
const COUNT=V.map((_,i)=>E.filter(e=>e[0]===i).length);
const ORDER=V.map((v,i)=>({...v,i})).filter(v=>COUNT[v.i]>0).sort((a,b)=>COUNT[b.i]-COUNT[a.i]);

const qs=new URLSearchParams(location.search);
const st={view:qs.get('view')==='map'?'map':'tiles', q:'', sel:new Set(), shown:[]};
if(qs.get('sel')) qs.get('sel').split(',').map(Number).filter(i=>COUNT[i]>0).forEach(i=>st.sel.add(i));
if(qs.has('applied')) st.shown=[...st.sel];

const mono=n=>n.replace(/[«»"]/g,'').split(/\s+/).slice(0,2).map(w=>w[0].toUpperCase()).join('');
const logo=v=>`<span class="logo" aria-hidden="true">${v.l?`<img src="venue-logos/${v.l}.svg" alt="" loading="lazy">`:`<span>${mono(v.n)}</span>`}</span>`;
const tick=`<span class="tick" aria-hidden="true">${ICON_TICK}</span>`;
const match=v=>{const q=st.q.trim().toLowerCase(); return !q||v.n.toLowerCase().includes(q)||v.a.toLowerCase().includes(q);};
const dirty=()=>{const a=[...st.sel].sort().join(), b=[...st.shown].sort().join(); return a!==b;};

function tools(){
  return `<div class="tools">
    <label class="search">${ICON_S}<input id="q" type="search" placeholder="Найти площадку или адрес" value="${esc(st.q)}" aria-label="Поиск площадки"><button class="search-clear" type="button" aria-label="Очистить поиск">${ICON_X}</button></label>
    <div class="seg" role="group" aria-label="Вид площадок"><button type="button" data-view="tiles" aria-pressed="${st.view==='tiles'}">Плитки</button><button type="button" data-view="map" aria-pressed="${st.view==='map'}">Карта</button></div>
    <span></span></div>`;
}
function tiles(list){
  return `<div class="tiles">${list.map(v=>`<button class="vt" type="button" data-i="${v.i}" aria-pressed="${st.sel.has(v.i)}"><span class="vt-top">${logo(v)}${tick}</span><span class="name">${esc(v.n)}</span><span class="addr">${esc(v.a)}</span></button>`).join('')}</div>`;
}
function mapView(list){
  const map=`<div class="map" role="img" aria-label="Карта площадок"><div class="map-c">${ICON_PIN}<div class="t">Карта площадок</div><div class="d">Яндекс Карты с метками площадок из списка. Наведение на строку подсвечивает метку; нажатие на метку отмечает площадку так же, как нажатие на строку. В макете вместо карты — заглушка.</div></div></div>`;
  return `<div class="split"><div class="rows scroll-quiet">${list.map(v=>`<button class="row" type="button" data-i="${v.i}" aria-pressed="${st.sel.has(v.i)}">${logo(v)}<span style="min-width:0"><span class="name" style="display:block">${esc(v.n)}</span><span class="addr">${esc(v.a)}</span></span>${tick}</button>`).join('')||'<div class="empty">Ничего не нашлось.</div>'}</div>${map}</div>`;
}

/* Карточки: одно событие — одна карточка в месяце; даты сворачиваются в «14 ноября» / «19–20 декабря» / «3 даты» */
function cards(rows){
  const by=new Map();
  rows.forEach(e=>{ if(!by.has(e[1])) by.set(e[1],[]); by.get(e[1]).push(e); });
  return [...by.values()].map(list=>{
    const e=list[0], days=[...new Set(list.map(x=>x[2]))], d0=new Date(days[0]+'T12:00');
    let day, mon=MON_G[d0.getMonth()], sub;
    if(days.length===1){ day=`${d0.getDate()}`; sub=`${DOW[d0.getDay()]}, ${[...new Set(list.map(x=>x[3]))].join(' и ')}`; }
    else {
      const dd=days.map(x=>+x.slice(8,10)), run=dd.every((x,k)=>!k||x===dd[k-1]+1);
      if(run) day=`${dd[0]}–${dd[dd.length-1]}`; else { day=`${days.length}`; mon=pl(days.length,'дата','даты','дат'); }
      sub=`${list.length} ${pl(list.length,'показ','показа','показов')}`;
    }
    const price=Math.min(...list.map(x=>x[4]));
    return `<a class="vh ${GENRE[e[5]]||'card-cool'}" href="#"><span class="vh-thumb"><span class="cover-blob cover-blob-1"></span><span class="vh-day">${day}</span><span class="vh-mon">${mon}</span></span>
      <span class="vh-body"><span class="event-card-meta">${esc(e[5])}<span class="event-card-age">${e[6]}+</span></span><span class="vh-title">${esc(e[1])}</span><span class="vh-sub">${sub}</span></span>
      <span class="vh-price"><span class="event-card-price-label">от</span><span class="event-card-price">${rub(price)}</span></span></a>`;
  }).join('');
}
function results(){
  return st.shown.map(i=>{
    const v=V[i], rows=E.filter(e=>e[0]===i), months=new Map();
    rows.forEach(e=>{ const k=e[2].slice(0,7); if(!months.has(k)) months.set(k,[]); months.get(k).push(e); });
    return `<section class="venue-block" aria-labelledby="vb-${i}"><div class="vb-head">${logo(v)}<div><h2 id="vb-${i}" tabindex="-1">${esc(v.n)}</h2><div class="addr">${esc(v.a)}</div></div></div>
      <div class="vb-body">${[...months].map(([k,list])=>{ const m=+k.slice(5,7)-1; const t=MON[m][0].toUpperCase()+MON[m].slice(1)+' '+k.slice(0,4);
        return `<div class="month"><h3>${t}</h3><div class="cards">${cards(list)}</div></div>`; }).join('')}</div></section>`;
  }).join('');
}
function applyBar(){
  const n=st.sel.size, on=dirty();
  apply.classList.toggle('on', on);
  apply.innerHTML = n
    ? `<span class="apply-n">Выбрано <b>${n}</b> ${pl(n,'площадка','площадки','площадок')}</span><button class="btn btn-ghost btn-sm" type="button" data-act="reset">Сбросить</button><button class="btn btn-primary btn-sm" type="button" data-act="apply">Применить</button>`
    : `<span class="apply-n">Площадки не выбраны</span><button class="btn btn-ghost btn-sm" type="button" data-act="apply">Скрыть события</button>`;
}
function render(){
  const list=ORDER.filter(match);
  app.innerHTML=`<div class="head"><h1>Площадки</h1><span class="t-caption">${ORDER.length} ${pl(ORDER.length,'площадка','площадки','площадок')}</span></div>`
    + tools() + (st.view==='tiles'?tiles(list):mapView(list))
    + `<div class="results" id="events">${results()}</div>`;
  applyBar();
  quietScroll(document.querySelector('.rows'));
}
/* Внутренняя прокрутка без системной полосы: класс .scroll-quiet из ядра; data-more — затухание у края, где есть ещё */
function quietScroll(el){ if(!el||el.dataset.qs) return; el.dataset.qs='1';
  const upd=()=>{ const m=[]; if(el.scrollTop>2) m.push('start'); if(el.scrollTop+el.clientHeight<el.scrollHeight-2) m.push('end'); el.dataset.more=m.join(' '); };
  el.addEventListener('scroll',upd,{passive:true}); if(window.ResizeObserver) new ResizeObserver(upd).observe(el); upd(); }

function setSel(i){ st.sel.has(i)?st.sel.delete(i):st.sel.add(i); document.querySelectorAll(`[data-i="${i}"]`).forEach(b=>b.setAttribute('aria-pressed', st.sel.has(i))); applyBar(); }
function doApply(){
  st.shown=ORDER.map(v=>v.i).filter(i=>st.sel.has(i));
  document.getElementById('events').innerHTML=results(); applyBar();
  if(!st.shown.length) return;
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.getElementById('events').scrollIntoView({behavior:reduce?'auto':'smooth', block:'start'});
  document.getElementById('vb-'+st.shown[0]).focus({preventScroll:true});
}
document.addEventListener('click',e=>{
  if(e.target.closest('.search-clear')){ e.preventDefault(); st.q=''; render(); document.getElementById('q').focus(); return; }
  const t=e.target.closest('[data-view],[data-i],[data-act],a.event-card');
  if(!t) return;
  if(t.matches('a')){ e.preventDefault(); return; }
  if(t.dataset.view){ st.view=t.dataset.view; render(); return; }
  if(t.dataset.i){ setSel(+t.dataset.i); return; }
  if(t.dataset.act==='reset'){ st.sel.clear(); document.querySelectorAll('[data-i]').forEach(b=>b.setAttribute('aria-pressed','false')); applyBar(); return; }
  if(t.dataset.act==='apply') doApply();
});
document.addEventListener('input',e=>{ if(e.target.id!=='q') return; st.q=e.target.value; const pos=e.target.selectionStart; render(); const q=document.getElementById('q'); q.focus(); q.setSelectionRange(pos,pos); });
document.addEventListener('mouseover',e=>{ const r=e.target.closest('.row'); document.querySelectorAll('.row.is-hl').forEach(x=>{ if(x!==r) x.classList.remove('is-hl'); }); if(r) r.classList.add('is-hl'); });
render();
</script>
