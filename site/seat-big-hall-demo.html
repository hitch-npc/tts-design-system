<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Большой зал — выбор мест</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Oranienbaum&family=Forum&family=Manrope:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400&text=%E2%82%BD&display=swap">
<style>
  :root { --ink:#0D0D0D; --n100:#D6D6D2; --n200:#C0C0BC; --n300:#A6A6A2; --n400:#8A8A88; --n500:#7A7A78; --n600:#626260; --n700:#4A4A48; --n800:#262930; --n900:#191C22; --n950:#111318;
    --accent:#0047FF; --accent-hover:#0038CC; --accent-ghost:#0B142A; --on-accent:#FFFFFF; --seat-sel:#22C55E; --seat-sold:#2C2F36; --seat-check:#FFFFFF; --danger-text:#FF8080;
    --r-sm:2px; --scrim:#000000; --overlay:#00000088;
    --font:'Manrope',system-ui,sans-serif; --f-num:'Oranienbaum','Source Serif 4',Georgia,serif; /* в Oranienbaum нет ₽ — знак берётся из Source Serif 4 */ --f-head:'Forum',Georgia,serif; --f-thin:'Cormorant Garamond',Georgia,serif; }
  *, *::before, *::after { box-sizing:border-box; }
  body { margin:0; padding:28px 20px 40px; background:var(--ink); color:var(--n100); font-family:var(--font); -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; }
  button { font:inherit; color:inherit; }
  button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .wrap { max-width:1280px; margin:0 auto; display:grid; gap:18px; }
  h1 { font-family:var(--f-thin); font-weight:400; font-size:2.2rem; line-height:1.1; margin:8px 0 0; }
  .eyebrow { font-size:10px; font-weight:600; letter-spacing:.22em; text-transform:uppercase; color:var(--n300); }
  .cap { font-size:10px; font-weight:500; letter-spacing:.14em; text-transform:uppercase; color:var(--n500); }
  .meta { font-size:12px; color:var(--n300); margin-top:8px; }
  .panel { border:1px solid var(--n800); background:var(--n950); border-radius:var(--r-sm); min-width:0; }
  .app { display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:16px; align-items:start; }

  /* ---- схема: камера двигает весь зал, места кликаются после приближения ---- */
  .map { position:sticky; top:16px; height:max(480px, min(calc(100vh - 136px), 820px)); min-height:480px; overflow:hidden; touch-action:pan-y; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; }
  .map.on { touch-action:none; cursor:grab; }
  .map.drag { cursor:grabbing; }
  .cam { position:absolute; left:0; top:0; transform-origin:0 0; padding:20px 20px 24px; }
  .cam.anim { transition:transform .6s cubic-bezier(.32,.72,.24,1); }
  .stage { width:56%; margin:0 auto 12px; text-align:center; font-size:9px; letter-spacing:.3em; text-transform:uppercase; color:var(--n500); border-bottom:2px solid var(--n800); padding-bottom:5px; }
  .hall { --s:10px; --g:3px; display:flex; flex-direction:column; align-items:center; gap:6px; }
  .zn { display:flex; flex-direction:column; align-items:center; gap:var(--g); padding:3px 8px 8px; border-radius:var(--r-sm); transition:background .15s, box-shadow .15s; }
  .map:not(.on) .zn { cursor:zoom-in; }
  .map:not(.on) .zn:hover { background:var(--n900); box-shadow:inset 0 0 0 1px var(--n800); }
  .zone { font-size:8px; font-weight:500; letter-spacing:.14em; text-transform:uppercase; color:var(--n500); margin:2px 0 1px; }
  .row { display:flex; align-items:center; gap:var(--g); }
  .rl { width:14px; font-size:7px; color:var(--n600); text-align:center; flex:none; }
  .aisle { width:var(--s); flex:none; }
  .seat { width:var(--s); height:var(--s); flex:none; border:0; padding:0; border-radius:calc(var(--s) / 5); cursor:pointer; position:relative; transition:opacity .2s, filter .15s, box-shadow .2s; }
  /* до приближения нажатие приходится на зону, после — на место; зона нажатия места — весь шаг сетки, без щелей */
  .map:not(.on) .seat { pointer-events:none; }
  .map.on .seat::before { content:''; position:absolute; inset:calc(var(--g) / -2); }
  .seat:hover:not(.sold) { filter:brightness(1.3); }
  .seat:focus-visible { outline:1px solid var(--n100); outline-offset:1px; }
  .seat.sold { background:var(--seat-sold) !important; cursor:default; opacity:.7; }
  .seat.dim { opacity:.1; }
  .seat.sold.dim { opacity:.05; }
  .seat.sel { background:var(--seat-sel) !important; opacity:1; box-shadow:0 0 0 .75px var(--ink), 0 0 0 1.5px var(--seat-sel); }
  .seat.sel::after { content:'✓'; position:absolute; inset:0; display:grid; place-items:center; font:700 calc(var(--s) * .72)/1 var(--font); color:var(--seat-check); } /* как .smap-dot-selected в ядре */
  .seat.hl { box-shadow:0 0 0 .75px var(--ink), 0 0 0 2px var(--n100); z-index:1; }

  /* поверх схемы */
  .ov-top { position:absolute; z-index:4; left:0; right:0; top:0; display:flex; align-items:center; gap:12px; padding:12px 124px 22px 12px; background:linear-gradient(var(--n950) 55%, transparent); pointer-events:none; opacity:0; transform:translateY(-6px); transition:opacity .25s, transform .25s; }
  .map.on .ov-top { opacity:1; transform:none; }
  .map.on .ov-top > * { pointer-events:auto; }
  .back { display:inline-flex; align-items:center; gap:6px; height:36px; padding:0 14px 0 10px; background:var(--n950); border:1px solid var(--n700); border-radius:var(--r-sm); color:var(--n100); font:600 11px var(--font); letter-spacing:.16em; text-transform:uppercase; cursor:pointer; white-space:nowrap; transition:border-color .15s; }
  .back:hover { border-color:var(--n500); }
  .crumb { font-size:10px; font-weight:500; letter-spacing:.14em; text-transform:uppercase; color:var(--n300); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .zoom { position:absolute; z-index:4; right:12px; bottom:12px; display:flex; flex-direction:column; gap:6px; }
  .zoom button { width:40px; height:40px; display:grid; place-items:center; padding:0; background:var(--n900); border:1px solid var(--n800); border-radius:var(--r-sm); color:var(--n200); cursor:pointer; transition:background .15s, color .15s; }
  .zoom button:hover:not(:disabled) { background:var(--n800); color:var(--n100); }
  .zoom button:disabled { color:var(--n700); cursor:default; }
  .zoom svg { width:18px; height:18px; }
  .mini { position:absolute; z-index:4; right:12px; top:12px; width:100px; padding:5px; background:var(--n900); border:1px solid var(--n800); border-radius:var(--r-sm); opacity:0; transition:opacity .25s; pointer-events:none; }
  .map.on .mini { opacity:1; }
  .mini svg { display:block; width:100%; height:auto; }
  .mini .mz { fill:var(--n800); }
  .mini .mz.cur { fill:var(--n600); }
  .mini .mv { fill:none; stroke:var(--n100); stroke-width:1.25; vector-effect:non-scaling-stroke; }
  .map-hint { position:absolute; z-index:3; left:14px; bottom:16px; right:64px; font-size:10px; font-weight:500; letter-spacing:.14em; text-transform:uppercase; color:var(--n500); pointer-events:none; transition:opacity .25s; }
  .map.on .map-hint { opacity:0; }

  .tip { position:absolute; z-index:6; min-width:176px; padding:10px 12px 11px; background:var(--n900); border:1px solid var(--n800); border-radius:var(--r-sm);
    box-shadow:0 14px 30px -12px var(--scrim); pointer-events:none; opacity:0; transform:translateY(4px); transition:opacity .16s, transform .16s; }
  .tip.on { opacity:1; transform:none; }
  .tip-where { font-size:10px; font-weight:500; letter-spacing:.14em; text-transform:uppercase; color:var(--n500); white-space:nowrap; }
  .tip-price { display:flex; align-items:center; gap:8px; margin-top:6px; font-family:var(--f-num); font-size:26px; line-height:1; color:var(--n100); white-space:nowrap; }
  .tip-price.sm { font-size:20px; }
  .tip-price .sw { width:14px; height:14px; border-radius:7px; flex:none; }
  .tip-hint { margin-top:7px; font-size:11px; color:var(--n400); }

  /* ---- правая колонка: легенда-фильтр сверху, заказ снизу ---- */
  /* одна прокрутка на легенду и заказ; итог и кнопка прилипают к низу панели */
  .side { position:sticky; top:16px; height:max(480px, min(calc(100vh - 136px), 820px)); display:flex; flex-direction:column; overflow:auto; overscroll-behavior:contain; scrollbar-width:thin; scrollbar-color:var(--n800) transparent; }
  .leg-block { flex:none; padding:18px 20px 0; }
  .leg-top, .ord-head { display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
  .leg-scroll { margin:10px -20px 0; padding:0 20px 6px; }
  .grp + .grp { border-top:1px solid var(--n900); padding-top:4px; }
  .band-h { display:grid; grid-template-columns:14px 1fr auto; gap:10px; align-items:center; width:100%; text-align:left; background:transparent; border:0; border-radius:var(--r-sm); cursor:pointer; padding:9px 6px; margin-bottom:2px; transition:background .15s, box-shadow .15s; }
  .band-h .lab { font-size:12px; font-weight:500; letter-spacing:.02em; color:var(--n300); transition:color .15s; }
  .band-h:hover .lab, .band-h[aria-pressed=true] .lab, .band-h[aria-pressed=mixed] .lab { color:var(--n100); }
  .n { font-size:10px; color:var(--n500); letter-spacing:.06em; white-space:nowrap; }
  /* диапазон — квадрат с градиентом его цен; цена — круглая точка */
  .sw { width:14px; height:14px; border-radius:var(--r-sm); display:block; }
  .chip .sw, .tk .sw { width:10px; height:10px; border-radius:5px; flex:none; }
  /* выбор в легенде: кобальт — только у диапазона, выбранного целиком; цены — нейтральная рамка и фон --n900 */
  .band-h:hover { background:var(--n900); }
  .band-h[aria-pressed=true] { background:var(--accent-ghost); box-shadow:inset 0 0 0 1px var(--accent); }
  .chips { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:2px 4px; padding:0 0 8px; }
  .chip { display:flex; align-items:center; gap:6px; min-width:0; min-height:36px; padding:0 6px 0 8px; border:1px solid transparent; border-radius:var(--r-sm); background:transparent; color:var(--n100); cursor:pointer; transition:background .15s, border-color .15s; }
  /* цены в легенде — Manrope с моноширинными цифрами: мелкий Oranienbaum в столбце читается тяжело */
  .chip .p { font-size:13px; font-weight:500; line-height:1; letter-spacing:0; font-variant-numeric:tabular-nums; white-space:nowrap; overflow:hidden; }
  .chip:hover { background:var(--n900); }
  .chip[aria-pressed=true] { background:var(--n900); border-color:var(--n500); }
  .reset { background:none; border:0; color:var(--n300); font:500 11px var(--font); letter-spacing:.14em; text-transform:uppercase; cursor:pointer; text-decoration:underline; text-decoration-color:var(--accent); text-underline-offset:3px; padding:0; white-space:nowrap; }
  .reset:hover { color:var(--n100); }

  .order { flex:1 0 auto; display:flex; flex-direction:column; border-top:1px solid var(--n800); }
  .ord-body { flex:1 0 auto; display:flex; flex-direction:column; }
  .ord-in { flex:1 0 auto; display:flex; flex-direction:column; }
  .ord-head { padding:16px 20px 10px; }
  .ord-list { flex:1 0 auto; list-style:none; margin:0; padding:0 12px 12px; display:flex; flex-direction:column; gap:4px; }
  .ord-empty { margin:auto; max-width:240px; padding:12px 8px; font-size:12px; line-height:1.6; color:var(--n500); text-align:center; }
  .tk { flex:none; display:flex; align-items:center; border:1px solid var(--n800); border-radius:var(--r-sm); background:var(--ink); transition:border-color .15s; }
  .tk:hover { border-color:var(--n700); }
  .tk-go { flex:1; min-width:0; display:grid; grid-template-columns:10px minmax(0,1fr) auto; gap:10px; align-items:center; padding:8px 4px 8px 12px; background:none; border:0; text-align:left; cursor:pointer; }
  .tk-txt { display:grid; gap:3px; min-width:0; }
  .tk-pl { font-size:13px; font-weight:500; color:var(--n100); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tk-pr { font-family:var(--f-num); font-size:17px; color:var(--n100); white-space:nowrap; }
  .tk-rm { flex:none; width:40px; height:40px; margin-right:2px; display:grid; place-items:center; padding:0; background:none; border:0; border-radius:var(--r-sm); color:var(--n500); cursor:pointer; transition:color .15s, background .15s; }
  .tk-rm:hover { color:var(--danger-text); background:var(--n900); }
  .ord-foot { position:sticky; bottom:0; z-index:1; flex:none; display:grid; gap:12px; padding:14px 20px 20px; background:var(--n950); border-top:1px solid var(--n800); }
  .ord-sum { display:flex; justify-content:space-between; align-items:baseline; gap:12px; width:100%; padding:0; background:none; border:0; text-align:left; pointer-events:none; }
  .ord-sum b { font-family:var(--f-num); font-size:24px; font-weight:400; line-height:1; color:var(--n100); white-space:nowrap; }
  .chev { display:none; }
  .buy { min-height:44px; width:100%; padding:0 18px; border:0; border-radius:var(--r-sm); background:var(--accent); color:var(--on-accent); font:700 11px var(--font); letter-spacing:.16em; text-transform:uppercase; cursor:pointer; transition:background .15s; }
  .buy:hover:not(:disabled) { background:var(--accent-hover); }
  .buy:disabled { background:var(--n800); color:var(--n600); cursor:default; }
  .scrim { display:none; }

  /* ---- телефон: схема на ширину экрана, легенда под ней, заказ — шторкой снизу, как .sticky-buy ---- */
  @media (max-width:900px) {
    body { padding:20px 16px calc(96px + env(safe-area-inset-bottom)); }
    h1 { font-size:1.75rem; }
    .app { grid-template-columns:1fr; gap:12px; }
    .map { position:relative; top:auto; height:min(68vh, 520px); min-height:400px; }
    .ov-top { padding:10px 112px 20px 10px; }
    .mini { width:88px; right:10px; top:10px; }
    .zoom { right:10px; bottom:10px; flex-direction:row; }
    .map-hint { left:12px; bottom:14px; right:168px; line-height:1.5; }
    .crumb .cr-p { display:none; }
    .zoom button { width:44px; height:44px; }
    .side { position:static; height:auto; overflow:visible; }
    .leg-block { padding-bottom:8px; }
    .leg-scroll { overflow:visible; }
    .order { position:fixed; z-index:20; left:0; right:0; bottom:0; min-height:0; background:var(--n950); border-top:1px solid var(--n800); box-shadow:0 -18px 40px -24px var(--scrim); }
    .ord-body { display:grid; grid-template-rows:0fr; transition:grid-template-rows 252ms cubic-bezier(.4,0,.2,1); }
    .order.open .ord-body { grid-template-rows:1fr; transition-duration:420ms; transition-timing-function:cubic-bezier(.16,1,.3,1); }
    .ord-in { overflow:hidden; display:block; }
    .ord-head { padding:16px 16px 10px; }
    .ord-list { max-height:min(46vh, 360px); overflow:auto; overscroll-behavior:contain; padding:0 10px 12px; }
    .ord-foot { position:static; }
    .ord-foot { grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:12px; padding:10px 16px calc(10px + env(safe-area-inset-bottom)); }
    .order.open .ord-foot { border-top-color:var(--n800); }
    .ord-sum { position:relative; flex-direction:column-reverse; align-items:flex-start; justify-content:center; gap:3px; min-height:44px; padding-right:24px; pointer-events:auto; cursor:pointer; }
    .ord-sum:disabled { cursor:default; }
    .ord-sum b { font-size:20px; }
    .ord-sum.empty b { display:none; }
    .ord-sum:not(:disabled) .chev { display:block; position:absolute; right:0; top:50%; width:16px; height:16px; margin-top:-8px; color:var(--n300); transition:transform 252ms cubic-bezier(.4,0,.2,1); }
    .order.open .chev { transform:rotate(180deg); }
    .buy { width:auto; padding:0 16px; white-space:nowrap; }
    .scrim { display:block; position:fixed; inset:0; z-index:19; background:var(--overlay); opacity:0; pointer-events:none; transition:opacity 252ms; }
    .scrim.on { opacity:1; pointer-events:auto; }
  }
  @media (prefers-reduced-motion: reduce) { .cam.anim, .tip, .ov-top, .mini, .map-hint, .ord-body, .chev, .scrim { transition:none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Выбор мест · большой зал</div>
    <h1>Пятнадцать цен в одном зале</h1>
    <div class="meta">Партер, амфитеатр, бельэтаж с ложами, два яруса и балкон · 15 цен · 1 104 места</div>
  </header>

  <div class="app">
    <section class="panel map" id="map" aria-label="Схема зала">
      <div class="cam" id="cam">
        <div class="stage">Сцена</div>
        <div class="hall" id="hall"></div>
      </div>
      <div class="ov-top">
        <button class="back" id="back" type="button"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>Вся схема</button>
        <span class="crumb" id="crumb"></span>
      </div>
      <div class="mini" aria-hidden="true"><svg id="mini"></svg></div>
      <div class="zoom">
        <button id="zin" type="button" aria-label="Приблизить"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
        <button id="zout" type="button" aria-label="Отдалить"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg></button>
        <button id="zfit" type="button" aria-label="Показать весь зал"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      </div>
      <div class="map-hint" id="hint">Нажмите на зону — схема приблизится</div>
      <div class="tip" id="tip" role="status" aria-live="polite"></div>
    </section>

    <aside class="panel side">
      <div class="leg-block">
        <div class="leg-top"><div class="cap">Цена · свободно мест</div><button class="reset" id="reset" type="button" aria-label="Сбросить фильтр" hidden>Сбросить</button></div>
        <div class="leg-scroll"><div id="leg"></div></div>
      </div>
      <div class="order" id="order">
        <div class="ord-body"><div class="ord-in">
          <div class="ord-head"><div class="cap">Ваш выбор</div><button class="reset" id="clearSel" type="button" hidden>Сбросить выбор</button></div>
          <ul class="ord-list" id="ordList"></ul>
        </div></div>
        <div class="ord-foot">
          <button class="ord-sum" id="ordToggle" type="button" aria-expanded="false" aria-controls="ordList"><span class="cap" id="ordN"></span><b id="selSum">0 ₽</b><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button>
          <button class="buy" id="buy" type="button" disabled>Перейти к оформлению</button>
        </div>
      </div>
    </aside>
  </div>
</div>
<div class="scrim" id="scrim"></div>

<script>
const fmtN=n=>n.toLocaleString('ru-RU').replace(/\s/g,' ');
const fmt=n=>fmtN(n)+' ₽';
const plural=n=>{const a=n%10,b=n%100;return a===1&&b!==11?'место':a>=2&&a<=4&&(b<12||b>14)?'места':'мест';};
/* Диапазоны и цены (по убыванию) */
const BANDS=[
  {lab:'от 20 000 ₽', prices:[25000,21000]},
  {lab:'12 000 – 19 999 ₽', prices:[17500,14000,12000]},
  {lab:'8 000 – 11 999 ₽', prices:[11000,10000,9000,8500]},
  {lab:'4 000 – 7 999 ₽', prices:[6500,5500,4500]},
  {lab:'до 4 000 ₽', prices:[3500,2500,1500]},
];
const PRICES=BANDS.flatMap(b=>b.prices);
/* Семьи цветов: оттенок — диапазон, светлота — цена внутри него (дороже — глубже) */
const FAMILY={25000:'#B28143',21000:'#E0AD6E',17500:'#106DCE',14000:'#388CF0',12000:'#6EADFE',
  11000:'#02717A',10000:'#1794A0',9000:'#36B8C5',8500:'#61DCE9',6500:'#7758BB',5500:'#9477DD',4500:'#B296FF',
  3500:'#C1587D',2500:'#E3769B',1500:'#FD9CBA'};
const col=p=>FAMILY[p];
const MAX_SEATS=10;               /* мест в одном заказе */
const PITCH=13;                   /* шаг сетки на схеме: место 10 + промежуток 3 */
const K_MAX=4;
const qs=new URLSearchParams(location.search);
const active=new Set((qs.get('f')||'').split(',').filter(Boolean).map(Number));
const selected=new Set();
const $=id=>document.getElementById(id);
const map=$('map'), cam=$('cam'), hall=$('hall'), tip=$('tip'), legEl=$('leg');
const coarse=()=>matchMedia('(pointer: coarse)').matches||map.clientWidth<600;
const phone=matchMedia('(max-width: 900px)');
const reduce=matchMedia('(prefers-reduced-motion: reduce)');

/* ---- зал ---- */
let seed=11; const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const seats=[], rows=[], ZONES=[];
function addRow(zone,rowNo,blocks){ /* blocks: [[count, price], 'aisle', ...] */
  const r={zone,rowNo,items:[]}; let n=0;
  blocks.forEach(b=>{ if(b==='aisle'){r.items.push('aisle');return;}
    for(let i=0;i<b[0];i++){ n++; const s={zone,row:rowNo,place:n,price:b[1],sold:rnd()<.3,id:seats.length}; seats.push(s); r.items.push(s);} });
  rows.push(r);
}
function zone(name,short,fn){ const z={name,short,start:rows.length}; ZONES.push(z); fn(); z.end=rows.length; }
zone('Партер','Партер',()=>{ for(let r=1;r<=18;r++){ const p=r<=3?25000:r<=7?21000:r<=11?17500:r<=15?14000:12000; addRow('Партер',r,[[14,p],'aisle',[14,p]]); } });
zone('Амфитеатр','Амфитеатр',()=>{ for(let r=1;r<=6;r++){ const p=r<=3?10000:8500; addRow('Амфитеатр',r,[[16,p],'aisle',[16,p]]); } });
zone('Бельэтаж · ложи по бокам','Бельэтаж',()=>{ for(let r=1;r<=3;r++) addRow('Бельэтаж',r,[[4,11000],'aisle',[12,9000],'aisle',[12,9000],'aisle',[4,11000]]); });
zone('1 ярус','1 ярус',()=>{ for(let r=1;r<=3;r++) addRow('1 ярус',r,[[4,5500],'aisle',[13,6500],[13,6500],'aisle',[4,5500]]); });
zone('2 ярус','2 ярус',()=>{ for(let r=1;r<=3;r++) addRow('2 ярус',r,[[4,3500],'aisle',[13,4500],[13,4500],'aisle',[4,3500]]); });
zone('Балкон','Балкон',()=>{ for(let r=1;r<=3;r++) addRow('Балкон',r,[[5,1500],'aisle',[13,2500],[13,2500],'aisle',[5,1500]]); });
const FREE=Object.fromEntries(PRICES.map(p=>[p,seats.filter(s=>s.price===p&&!s.sold).length]));
const bandFree=bi=>BANDS[bi].prices.reduce((a,p)=>a+FREE[p],0);

ZONES.forEach((z,zi)=>{
  const zn=document.createElement('div'); zn.className='zn'; zn.dataset.z=zi;
  zn.innerHTML=`<div class="zone">${z.name}</div>`;
  const zs=[];
  for(let i=z.start;i<z.end;i++){
    const r=rows[i]; const el=document.createElement('div'); el.className='row';
    el.innerHTML=`<span class="rl">${r.rowNo}</span>`;
    r.items.forEach(s=>{
      if(s==='aisle'){el.insertAdjacentHTML('beforeend','<span class="aisle"></span>');return;}
      const b=document.createElement('button'); b.type='button'; b.className='seat'+(s.sold?' sold':''); b.dataset.id=s.id;
      b.setAttribute('aria-label',`${s.zone}, ряд ${s.row}, место ${s.place}, ${fmt(s.price)}${s.sold?', продано':''}`);
      b.style.background=col(s.price);
      s.el=b; s.zi=zi; zs.push(s); el.appendChild(b);
    });
    el.insertAdjacentHTML('beforeend',`<span class="rl">${r.rowNo}</span>`);
    zn.appendChild(el);
  }
  z.el=zn; z.min=Math.min(...zs.map(s=>s.price)); z.max=Math.max(...zs.map(s=>s.price)); z.free=zs.filter(s=>!s.sold).length;
  hall.appendChild(zn);
});

/* ---- камера ---- */
const view={x:0,y:0,k:1}; let k0=1, W=0, H=0, WW=0, WH=0;
const isOn=()=>view.k>k0*1.04;
const kTarget=()=>(coarse()?26:20)/PITCH; /* шаг места на экране после приближения: палец — 26 px, мышь — 20 px */
const topPad=()=>isOn()?56:16;
function measure(){ W=map.clientWidth; H=map.clientHeight; WW=cam.offsetWidth; WH=cam.offsetHeight; k0=Math.min((W-24)/WW,(H-24-(phone.matches?60:0))/WH); }
function clamp(){
  const m=16, sw=WW*view.k, sh=WH*view.k, t=topPad();
  view.x = sw<=W-2*m ? (W-sw)/2 : Math.min(m, Math.max(W-m-sw, view.x));
  view.y = sh<=H-t-m ? t+(phone.matches?0:(H-t-m-sh)/2) : Math.min(t, Math.max(H-m-sh, view.y));
}
function apply(anim){
  cam.classList.toggle('anim', !!anim && !reduce.matches);
  cam.style.transform=`translate(${view.x}px,${view.y}px) scale(${view.k})`;
  hideTip(); state();
}
function overview(anim=true){ view.k=k0; clamp(); apply(anim); }
function local(cx,cy){ const r=map.getBoundingClientRect(); return [cx-r.left, cy-r.top]; }
function zoomAt(f,lx=W/2,ly=H/2,anim=true){
  const wx=(lx-view.x)/view.k, wy=(ly-view.y)/view.k;
  view.k=Math.min(K_MAX, Math.max(k0, view.k*f));
  if(view.k<=k0*1.04) return overview(anim);
  view.x=lx-wx*view.k; view.y=ly-wy*view.k; clamp(); apply(anim);
}
/* нажатие на зону: приблизить так, чтобы места стали удобного размера; широкую зону — к точке нажатия */
function pick(zi,cx,cy){
  const e=ZONES[zi].el, bx=e.offsetLeft, by=e.offsetTop, bw=e.offsetWidth, bh=e.offsetHeight;
  const t=56, aH=H-t-16, kt=kTarget(), fit=.92*Math.min(W/bw, aH/bh);
  const k=Math.min(K_MAX, Math.max(kt, Math.min(fit, kt*1.35)));
  let wx=bx+bw/2, wy=by+bh/2;
  if(cx!=null){ const [lx,ly]=local(cx,cy); const px=(lx-view.x)/view.k, py=(ly-view.y)/view.k;
    if(bw*k>W*.92) wx=Math.min(bx+bw, Math.max(bx, px));
    if(bh*k>aH) wy=Math.min(by+bh, Math.max(by, py)); }
  view.k=k; view.x=W/2-wx*k; view.y=t+aH/2-wy*k; clamp(); apply(true);
  if(phone.matches){ const r=map.getBoundingClientRect(); if(r.top<0||r.bottom>innerHeight-80) window.scrollBy({top:r.top-12, behavior:reduce.matches?'auto':'smooth'}); }
}
/* место из заказа — показать на схеме */
function focusSeat(s){
  const b=s.el, wx=b.offsetLeft+b.offsetWidth/2, wy=b.offsetTop+b.offsetHeight/2;
  view.k=Math.max(view.k, kTarget()); view.x=W/2-wx*view.k; view.y=(H+40)/2-wy*view.k; clamp(); apply(true);
  b.classList.add('hl'); setTimeout(()=>b.classList.remove('hl'), 1400);
}
let curZone=0;
function state(){
  const on=isOn(); map.classList.toggle('on',on);
  if(on){ const cx=(W/2-view.x)/view.k, cy=(H/2-view.y)/view.k; let bd=Infinity;
    ZONES.forEach((z,i)=>{ const e=z.el; const dx=Math.max(e.offsetLeft-cx,0,cx-e.offsetLeft-e.offsetWidth), dy=Math.max(e.offsetTop-cy,0,cy-e.offsetTop-e.offsetHeight), d=dx*dx+dy*dy; if(d<bd){bd=d;curZone=i;} });
    const z=ZONES[curZone]; $('crumb').innerHTML=`${z.short}<span class="cr-p"> · ${fmtN(z.min)}${z.min!==z.max?' – '+fmtN(z.max):''} ₽</span>`; }
  $('zout').disabled=!on; $('zin').disabled=view.k>=K_MAX-.01; $('zfit').disabled=!on;
  miniView();
}
/* мини-карта: где вы на схеме */
const mini=$('mini');
function miniBuild(){
  mini.setAttribute('viewBox',`0 0 ${WW} ${WH}`);
  mini.innerHTML=ZONES.map((z,i)=>`<rect class="mz" data-i="${i}" x="${z.el.offsetLeft}" y="${z.el.offsetTop}" width="${z.el.offsetWidth}" height="${z.el.offsetHeight}" rx="3"/>`).join('')+'<rect class="mv" id="mv" rx="2"/>';
}
function miniView(){
  const v=$('mv'); if(!v) return;
  const x=Math.max(0,-view.x/view.k), y=Math.max(0,-view.y/view.k), x2=Math.min(WW,(W-view.x)/view.k), y2=Math.min(WH,(H-view.y)/view.k);
  v.setAttribute('x',x); v.setAttribute('y',y); v.setAttribute('width',Math.max(0,x2-x)); v.setAttribute('height',Math.max(0,y2-y));
  mini.querySelectorAll('.mz').forEach(r=>r.classList.toggle('cur', +r.dataset.i===curZone));
}
$('zin').onclick=()=>{ if(!isOn()) return pick(curZone); zoomAt(1.5); };
$('zout').onclick=()=>zoomAt(1/1.5);
$('zfit').onclick=$('back').onclick=()=>overview();

/* перетаскивание, щипок двумя пальцами, колесо */
const pts=new Map(); let drag=null, pinch=null, moved=false, lastPT='mouse';
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
map.addEventListener('pointerdown',e=>{
  lastPT=e.pointerType;
  if(e.target.closest('.ov-top, .zoom')) return;
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===1){ drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y}; moved=false; }
  if(pts.size===2){ const [a,b]=[...pts.values()]; const [mx,my]=local((a.x+b.x)/2,(a.y+b.y)/2);
    pinch={d:dist(a,b)||1,k:view.k,wx:(mx-view.x)/view.k,wy:(my-view.y)/view.k}; moved=true; }
});
addEventListener('pointermove',e=>{
  if(!pts.has(e.pointerId)) return;
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&pts.size>=2){ const [a,b]=[...pts.values()]; const [mx,my]=local((a.x+b.x)/2,(a.y+b.y)/2);
    view.k=Math.min(K_MAX,Math.max(k0,pinch.k*dist(a,b)/pinch.d)); view.x=mx-pinch.wx*view.k; view.y=my-pinch.wy*view.k; clamp(); apply(false); return; }
  if(!drag) return;
  const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
  if(!moved&&Math.hypot(dx,dy)>6) moved=true;
  if(moved&&isOn()){ map.classList.add('drag'); view.x=drag.vx+dx; view.y=drag.vy+dy; clamp(); apply(false); }
});
function up(e){
  if(!pts.delete(e.pointerId)) return;
  if(pts.size<2) pinch=null;
  if(pts.size===1){ const p=[...pts.values()][0]; drag={x:p.x,y:p.y,vx:view.x,vy:view.y}; }
  if(!pts.size){ drag=null; map.classList.remove('drag'); if(!isOn()&&view.k!==k0) overview(); }
}
addEventListener('pointerup',up); addEventListener('pointercancel',up);
map.addEventListener('click',e=>{ if(moved){ e.stopPropagation(); e.preventDefault(); moved=false; } },true);
map.addEventListener('wheel',e=>{
  if(e.ctrlKey||e.metaKey){ e.preventDefault(); const [lx,ly]=local(e.clientX,e.clientY); zoomAt(Math.exp(-e.deltaY*.01),lx,ly,false); }
  else if(isOn()){ e.preventDefault(); view.x-=e.deltaX; view.y-=e.deltaY; clamp(); apply(false); }
},{passive:false});

/* ---- выбор места ---- */
hall.addEventListener('click',e=>{
  const b=e.target.closest('.seat'), zn=e.target.closest('.zn');
  if(b&&(isOn()||e.detail===0)) return toggleSeat(seats[+b.dataset.id]); /* e.detail 0 — клавиатура: ей приближение не нужно */
  if(zn&&!isOn()) pick(+zn.dataset.z, e.clientX, e.clientY);
});
let tipTimer=0;
function toggleSeat(s){
  let note='';
  if(!s.sold){
    if(selected.has(s.id)) selected.delete(s.id);
    else if(selected.size>=MAX_SEATS) note='limit';
    else selected.add(s.id);
    refresh();
  }
  showTip(s,note);
  clearTimeout(tipTimer); if(lastPT!=='mouse') tipTimer=setTimeout(hideTip,2200);
}

/* ---- подсказки ---- */
function place(r,below){
  const P=map.getBoundingClientRect(); tip.classList.add('on');
  const tw=tip.offsetWidth, th=tip.offsetHeight;
  let x=r.left-P.left+r.width/2-tw/2; x=Math.max(8,Math.min(P.width-tw-8,x));
  let y=r.top-P.top-th-10; if(below||y<(isOn()?60:8)) y=r.bottom-P.top+10;
  tip.style.left=x+'px'; tip.style.top=Math.min(y,P.height-th-8)+'px';
}
let tipKey=null;
function showTip(s,note){
  tipKey='s'+s.id;
  const hint=note==='limit'?`В заказе уже ${MAX_SEATS} мест — это максимум`:selected.has(s.id)?'В заказе · нажмите ещё раз, чтобы убрать':'Нажмите, чтобы добавить в заказ';
  tip.innerHTML=`<div class="tip-where">${s.zone} · ряд ${s.row} · место ${s.place}</div>`+
    (s.sold?`<div class="tip-price" style="color:var(--n500)">Продано</div>`:
    `<div class="tip-price"><i class="sw" style="background:${col(s.price)}"></i>${fmt(s.price)}</div><div class="tip-hint">${hint}</div>`);
  place(s.el.getBoundingClientRect());
}
function showZoneTip(zi,cx,cy){
  const z=ZONES[zi];
  if(tipKey!=='z'+zi){ tipKey='z'+zi;
    tip.innerHTML=`<div class="tip-where">${z.name}</div><div class="tip-price sm">${z.min!==z.max?fmtN(z.min)+' – ':''}${fmt(z.max)}</div><div class="tip-hint">${z.free} свободно · нажмите, чтобы приблизить</div>`; }
  place({left:cx-1,top:cy-6,width:2,height:12,bottom:cy+18});
}
function hideTip(){ tipKey=null; tip.classList.remove('on'); }
hall.addEventListener('pointermove',e=>{
  if(e.pointerType!=='mouse'||drag&&moved) return;
  const b=e.target.closest('.seat'), zn=e.target.closest('.zn');
  if(isOn()){ if(b&&tipKey!=='s'+b.dataset.id) showTip(seats[+b.dataset.id]); }
  else if(zn) showZoneTip(+zn.dataset.z,e.clientX,e.clientY);
});
hall.addEventListener('pointerleave',e=>{ if(e.pointerType==='mouse') hideTip(); });
hall.addEventListener('focusin',e=>{ const b=e.target.closest('.seat'); if(b) showTip(seats[+b.dataset.id]); });
document.addEventListener('pointerdown',e=>{ if(!e.target.closest('.seat')) hideTip(); });

/* ---- легенда: нажатие на диапазон или цену гасит остальные места, наведение — подсвечивает заранее ---- */
let preview=null;
function dim(){ const set=preview||active, on=set.size>0; seats.forEach(s=>s.el.classList.toggle('dim',on&&!set.has(s.price))); }
document.addEventListener('mouseover',e=>{
  const pr=e.target.closest('[data-price]'), bh=e.target.closest('[data-band]');
  const next=pr?new Set([+pr.dataset.price]):bh?new Set(BANDS[+bh.dataset.band].prices):null;
  const same=(a,b)=>a===b||(a&&b&&a.size===b.size&&[...a].every(x=>b.has(x)));
  if(!same(next,preview)){ preview=next; dim(); }
});
const chip=p=>{ const t=`${fmt(p)} · ${FREE[p]} свободно`;
  return `<button class="chip" type="button" data-price="${p}" title="${t}" aria-label="${t}"><i class="sw" style="background:${col(p)}"></i><span class="p">${fmt(p)}</span></button>`; };
legEl.innerHTML=BANDS.map((b,bi)=>`<div class="grp"><button class="band-h" type="button" data-band="${bi}"><i class="sw" style="background:linear-gradient(135deg, ${b.prices.map(col).join(', ')})"></i><span class="lab">${b.lab}</span><span class="n">${bandFree(bi)} свободно</span></button><div class="chips">${b.prices.map(chip).join('')}</div></div>`).join('');
function syncLegend(){
  legEl.querySelectorAll('[data-price]').forEach(b=>b.setAttribute('aria-pressed',active.has(+b.dataset.price)));
  legEl.querySelectorAll('[data-band]').forEach(b=>{
    const ps=BANDS[+b.dataset.band].prices, k=ps.filter(p=>active.has(p)).length;
    b.setAttribute('aria-pressed',k===ps.length?'true':k?'mixed':'false'); });
  $('reset').hidden=!active.size;
}
legEl.addEventListener('click',e=>{
  const bh=e.target.closest('[data-band]'), pr=e.target.closest('[data-price]');
  if(bh){ const ps=BANDS[+bh.dataset.band].prices, on=ps.every(p=>active.has(p)); ps.forEach(p=>on?active.delete(p):active.add(p)); }
  else if(pr){ const p=+pr.dataset.price; active.has(p)?active.delete(p):active.add(p); }
  else return;
  refresh();
});
$('reset').onclick=()=>{ active.clear(); refresh(); };

/* ---- заказ ---- */
const TRASH='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>';
const order=$('order'), ordList=$('ordList'), ordToggle=$('ordToggle'), scrim=$('scrim');
function renderOrder(){
  const arr=[...selected].map(id=>seats[id]), n=arr.length;
  ordList.innerHTML=n?arr.map(s=>{ const w=`${s.zone}, ряд ${s.row}, место ${s.place}`;
    return `<li class="tk" data-id="${s.id}"><button class="tk-go" type="button" data-go="${s.id}" aria-label="Показать на схеме: ${w}"><i class="sw" style="background:${col(s.price)}"></i><span class="tk-txt"><span class="cap">${s.zone}</span><span class="tk-pl">Ряд ${s.row} · место ${s.place}</span></span><span class="tk-pr">${fmt(s.price)}</span></button><button class="tk-rm" type="button" data-rm="${s.id}" aria-label="Убрать: ${w}" title="Убрать">${TRASH}</button></li>`; }).join('')
    :'<li class="ord-empty">Места не выбраны. Нажмите на зону — схема приблизится, затем выберите кресло.</li>';
  $('ordN').textContent=n?`${n} ${plural(n)}${phone.matches?'':' · итого'}`:'Места не выбраны';
  $('selSum').textContent=fmt(arr.reduce((a,s)=>a+s.price,0));
  ordToggle.classList.toggle('empty',!n); ordToggle.disabled=phone.matches&&!n;
  $('buy').disabled=!n; $('clearSel').hidden=!n;
  if(!n) sheet(false);
}
ordList.addEventListener('click',e=>{
  const rm=e.target.closest('[data-rm]'), go=e.target.closest('[data-go]');
  if(rm){ selected.delete(+rm.dataset.rm); refresh(); }
  else if(go){ sheet(false); focusSeat(seats[+go.dataset.go]); }
});
ordList.addEventListener('mouseover',e=>{ const li=e.target.closest('.tk'); seats.forEach(s=>s.el.classList.toggle('hl', !!li&&s.id===+li.dataset.id)); });
ordList.addEventListener('mouseleave',()=>seats.forEach(s=>s.el.classList.remove('hl')));
$('clearSel').onclick=()=>{ selected.clear(); refresh(); };
function sheet(open){
  open=open&&phone.matches&&selected.size>0;
  order.classList.toggle('open',open); scrim.classList.toggle('on',open); ordToggle.setAttribute('aria-expanded',open);
}
ordToggle.onclick=()=>sheet(!order.classList.contains('open'));
scrim.onclick=()=>sheet(false);
addEventListener('keydown',e=>{ if(e.key==='Escape'){ if(order.classList.contains('open')) sheet(false); else if(isOn()) overview(); } });
function syncPhone(){ ordToggle.tabIndex=phone.matches?0:-1; if(!phone.matches) sheet(false); renderOrder(); }
phone.addEventListener('change',syncPhone);

function refresh(){ seats.forEach(s=>s.el.classList.toggle('sel',selected.has(s.id))); dim(); syncLegend(); renderOrder(); }

/* ---- старт ---- */
function layout(){
  const was=isOn(), cx=(W/2-view.x)/view.k, cy=(H/2-view.y)/view.k;
  measure(); miniBuild();
  if(was){ view.x=W/2-cx*view.k; view.y=H/2-cy*view.k; clamp(); apply(false); } else overview(false);
}
/* для кадров: ?sel=1 — места в заказе, ?z=<зона> — приближенная зона, ?tip=1 — подсказка у места, ?sheet=1 — открытая шторка заказа */
if(qs.get('sel')==='1'){ seats.filter(s=>!s.sold&&s.zone==='Партер'&&s.row===5).slice(10,12).forEach(s=>selected.add(s.id)); seats.filter(s=>!s.sold&&s.zone==='Балкон').slice(14,15).forEach(s=>selected.add(s.id)); }
syncPhone(); refresh(); layout();
new ResizeObserver(layout).observe(map);
(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>{
  layout();
  const z=qs.get('z'); if(z===null) return;
  pick(+z);
  if(qs.get('tip')==='1') setTimeout(()=>{ const c=map.getBoundingClientRect(); let best=null, bd=Infinity;
    seats.forEach(s=>{ if(s.zi!==+z||s.sold) return; const r=s.el.getBoundingClientRect(), d=Math.hypot(r.left-c.left-W*.5,r.top-c.top-H*.55); if(d<bd){bd=d;best=s;} });
    if(best) showTip(best); },700);
  if(qs.get('sheet')==='1') setTimeout(()=>sheet(true),700);
});
</script>
</body>
</html>
