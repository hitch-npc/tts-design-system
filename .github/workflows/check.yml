name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Сборка и проверки без зависимостей — npm install не нужен
      # check:strict — токены, копии, страж правил и сторож расхождений
      - name: Токены, копии, страж и сторож расхождений
        run: npm run check:strict
      - name: Проверка перед публикацией
        run: npm run security
